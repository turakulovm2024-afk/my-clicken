<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🚀 Кликер Профи – Чистая версия</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a; font-family: 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; color: white; padding: 20px;
    }
    .screen { display: none; width: 100%; max-width: 400px; }
    .screen.active { display: block; }

    .btn {
      background: #2a2a4a; color: white; border: none; border-radius: 16px;
      padding: 14px 24px; font-size: 18px; cursor: pointer; width: 100%; margin: 6px 0;
      transition: all 0.2s; font-weight: bold;
    }
    .btn:active { transform: scale(0.96); background: #3a3a6a; }
    .btn-accent { background: #6c5ce7; }
    .btn-gold { background: #f39c12; color: #111; }

    .card {
      background: #1a1a2e; border-radius: 24px; padding: 20px; margin: 16px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .clicker {
      background: #ff9f43; border-radius: 50%;
      width: 180px; height: 180px; display: flex; align-items: center;
      justify-content: center; font-size: 40px; margin: 20px auto;
      box-shadow: 0 10px 0 #d35400, 0 20px 25px rgba(0,0,0,0.5);
      cursor: pointer; user-select: none; transition: 0.1s;
      touch-action: manipulation;
    }
    .clicker:active { transform: scale(0.92); box-shadow: 0 4px 0 #d35400; }

    .stats { display: flex; justify-content: center; }
    .stat { background: #2a2a4a; border-radius: 16px; padding: 14px; margin: 4px; text-align: center; }

    .nav {
      display: flex; justify-content: space-around; background: #12121f;
      padding: 10px; border-radius: 24px; margin-top: 20px;
    }
    .nav-btn { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; }
    .nav-btn.active { color: #ff9f43; font-weight: bold; }

    .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .skin-item { background: #2a2a4a; border-radius: 20px; padding: 14px; text-align: center; cursor: pointer; }
    .skin-item.active { border: 2px solid #ff9f43; }
    .skin-preview { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px; background: #ff9f43; }

    .coin-game { display: flex; gap: 10px; justify-content: center; }
    .coin-btn {
      background: #2a2a4a; border: none; border-radius: 16px; padding: 20px;
      font-size: 28px; cursor: pointer; color: white;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ГЛАВНАЯ -->
  <div id="home" class="screen active">
    <div class="card" style="text-align:center;">
      <h1 id="coinDisplay">0 💰</h1>
      <p id="perClick">1 за клик</p>
    </div>
    <div class="clicker" id="clickBtn">🔥</div>
    <div class="stats">
      <div class="stat">Всего кликов<br><b id="totalClicks">0</b></div>
    </div>
    <div id="boosts"></div>
  </div>

  <!-- МАГАЗИН -->
  <div id="shop" class="screen">
    <h2>🛒 Магазин</h2>
    <button class="btn btn-accent" id="buyClickUp">➕ Клик +1 (10 монет)</button>
    <button class="btn btn-gold" id="buyX2Boost">⚡ x2 Буст (5 мин) - 50</button>
    <button class="btn" id="buyAutoClick">🤖 Автоклик (10 сек) - 200</button>
  </div>

  <!-- МИНИ-ИГРЫ -->
  <div id="games" class="screen">
    <h2>🎮 Мини-игры</h2>
    <div class="card">
      <h3>🪙 Орёл и решка</h3>
      <p>Ставка: 10 монет</p>
      <div class="coin-game">
        <button class="coin-btn" id="btnHeads">🦅 Орёл</button>
        <button class="coin-btn" id="btnTails">💰 Решка</button>
      </div>
      <p id="coinResult"></p>
    </div>
  </div>

  <!-- СКИНЫ -->
  <div id="skins" class="screen">
    <h2>🎨 Скины</h2>
    <div class="skin-grid" id="skinGrid"></div>
  </div>

  <!-- ПРОФИЛЬ -->
  <div id="profile" class="screen">
    <h2>👤 Профиль</h2>
    <input type="text" id="nickInput" placeholder="Введи ник" style="width:100%; padding:14px; border-radius:16px; border:none; margin:10px 0;">
    <button class="btn btn-accent" id="saveNick">Сохранить</button>
    <div class="card">
      <p>Последний вход: <span id="lastLogin">-</span></p>
    </div>
    <button class="btn" id="resetBtn">🔄 Сбросить прогресс</button>
    <button class="btn" id="deleteInactiveBtn">🧹 Удалить неактивных (>30 дней)</button>
  </div>

  <!-- НАВИГАЦИЯ -->
  <div class="nav">
    <button class="nav-btn active" data-screen="home">🏠</button>
    <button class="nav-btn" data-screen="shop">🛒</button>
    <button class="nav-btn" data-screen="games">🎮</button>
    <button class="nav-btn" data-screen="skins">🎨</button>
    <button class="nav-btn" data-screen="profile">👤</button>
  </div>
</div>

<script type="importmap">
  { "imports": { "firebase/app": "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js", "firebase/database": "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js" } }
</script>
<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, set, onValue, update, get, remove } from "firebase/database";

const firebaseConfig = { databaseURL: "https://mygame-b11bf-default-rtdb.firebaseio.com/" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------- СОСТОЯНИЕ ----------
let playerName = localStorage.getItem('clickerProNick') || '';
if (!playerName) {
  playerName = prompt('Введи ник:') || 'Кликер_' + Math.floor(Math.random()*1000);
  localStorage.setItem('clickerProNick', playerName);
}

let state = {
  coins: 0,
  totalClicks: 0,
  perClick: 1,
  activeSkins: ['default'],
  currentSkin: 'default',
  boostUntil: 0,
  autoClickUntil: 0,
  lastLogin: null
};

// ---------- СКИНЫ ----------
const SKINS = {
  default: { name:'Обычный', bg:'#ff9f43', shadow:'#d35400' },
  green: { name:'Зелёный', bg:'#2ecc71', shadow:'#1e8449' },
  blue: { name:'Синий', bg:'#3498db', shadow:'#1f618d' },
  purple: { name:'Фиолетовый', bg:'#9b59b6', shadow:'#6c3483' },
  gold: { name:'Золотой', bg:'#f1c40f', shadow:'#b8860b' }
};

// ---------- ЭЛЕМЕНТЫ ----------
const coinDisplay = document.getElementById('coinDisplay');
const clickBtn = document.getElementById('clickBtn');
const totalClicksEl = document.getElementById('totalClicks');
const perClickEl = document.getElementById('perClick');
const boostsDiv = document.getElementById('boosts');
const lastLoginEl = document.getElementById('lastLogin');

// ---------- FIREBASE ----------
const userRef = ref(db, 'clickerpro/' + playerName);
onValue(userRef, async (snap) => {
  const data = snap.val();
  if (!data) {
    // Новый игрок
    const nowString = new Date().toLocaleString();
    await set(userRef, {
      coins: 0,
      totalClicks: 0,
      perClick: 1,
      activeSkins: ['default'],
      currentSkin: 'default',
      boostUntil: 0,
      autoClickUntil: 0,
      lastLogin: nowString
    });
    return;
  }

  // Обновляем lastLogin на читаемую дату
  const nowString = new Date().toLocaleString();
  const updates = { lastLogin: nowString };

  // Удаляем лишнее поле prestige, если оно есть
  if (data.prestige !== undefined) {
    updates.prestige = null; // удалит поле из базы
  }

  await update(userRef, updates);

  // Обновляем локальное состояние
  state = {
    coins: data.coins || 0,
    totalClicks: data.totalClicks || 0,
    perClick: data.perClick || 1,
    activeSkins: data.activeSkins || ['default'],
    currentSkin: data.currentSkin || 'default',
    boostUntil: data.boostUntil || 0,
    autoClickUntil: data.autoClickUntil || 0,
    lastLogin: nowString
  };

  renderUI();
});

function save() {
  update(userRef, {
    coins: state.coins,
    totalClicks: state.totalClicks,
    perClick: state.perClick,
    activeSkins: state.activeSkins,
    currentSkin: state.currentSkin,
    boostUntil: state.boostUntil,
    autoClickUntil: state.autoClickUntil
  });
}

// ---------- КЛИК (МУЛЬТИТАЧ) ----------
function handleClick(e) {
  let mult = 1;
  if (Date.now() < state.boostUntil) mult = 2;
  
  if (e.touches) {
    for (let i = 0; i < e.touches.length; i++) {
      state.coins += state.perClick * mult;
      state.totalClicks += 1;
    }
  } else {
    state.coins += state.perClick * mult;
    state.totalClicks += 1;
  }
  
  // Достижения
  if (state.totalClicks >= 100 && !state.activeSkins.includes('green')) {
    state.activeSkins.push('green');
    alert('🎉 Скин "Зелёный" разблокирован!');
  }
  if (state.totalClicks >= 500 && !state.activeSkins.includes('blue')) {
    state.activeSkins.push('blue');
    alert('🎉 Скин "Синий" разблокирован!');
  }
  if (state.totalClicks >= 2000 && !state.activeSkins.includes('purple')) {
    state.activeSkins.push('purple');
    alert('🎉 Скин "Фиолетовый" разблокирован!');
  }
  if (state.totalClicks >= 10000 && !state.activeSkins.includes('gold')) {
    state.activeSkins.push('gold');
    alert('🎉 Скин "Золотой" разблокирован!');
  }
  
  save();
  renderUI();
}

clickBtn.addEventListener('mousedown', handleClick);
clickBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });

// ---------- МАГАЗИН ----------
document.getElementById('buyClickUp').onclick = () => {
  if (state.coins >= 10) { state.coins -= 10; state.perClick += 1; save(); }
  else alert('Недостаточно монет!');
};
document.getElementById('buyX2Boost').onclick = () => {
  if (state.coins >= 50) { state.coins -= 50; state.boostUntil = Date.now() + 5*60*1000; save(); }
  else alert('Недостаточно монет!');
};
document.getElementById('buyAutoClick').onclick = () => {
  if (state.coins >= 200) { state.coins -= 200; state.autoClickUntil = Date.now() + 10*1000; save(); }
  else alert('Недостаточно монет!');
};

// ---------- АВТОКЛИК ----------
setInterval(() => {
  if (Date.now() < state.autoClickUntil) {
    state.coins += state.perClick;
    state.totalClicks += 1;
    save();
    renderUI();
  }
}, 1000);

// ---------- МИНИ-ИГРА (ОРЁЛ И РЕШКА) ----------
document.getElementById('btnHeads').onclick = () => playCoin('heads');
document.getElementById('btnTails').onclick = () => playCoin('tails');

function playCoin(choice) {
  const stake = 10;
  if (state.coins < stake) {
    document.getElementById('coinResult').textContent = 'Недостаточно монет!';
    return;
  }
  const side = Math.random() < 0.5 ? 'heads' : 'tails';
  const win = choice === side;
  if (win) {
    state.coins += stake;
    document.getElementById('coinResult').textContent = `Выпал ${side === 'heads' ? 'Орёл' : 'Решка'}! Ты выиграл +${stake}`;
  } else {
    state.coins -= stake;
    document.getElementById('coinResult').textContent = `Выпал ${side === 'heads' ? 'Орёл' : 'Решка'}! Ты проиграл -${stake}`;
  }
  save();
  renderUI();
}

// ---------- СКИНЫ ----------
function renderSkins() {
  const grid = document.getElementById('skinGrid');
  grid.innerHTML = Object.entries(SKINS).map(([id, s]) => {
    const owned = state.activeSkins.includes(id);
    return `<div class="skin-item ${state.currentSkin===id?'active':''} ${!owned?'locked':''}" 
      onclick="${owned ? `applySkin('${id}')` : ''}">
      <div class="skin-preview" style="background:${s.bg}"></div>
      ${s.name} ${!owned?'🔒':''}
    </div>`;
  }).join('');
}

window.applySkin = (id) => {
  state.currentSkin = id;
  const skin = SKINS[id];
  clickBtn.style.background = skin.bg;
  clickBtn.style.boxShadow = `0 10px 0 ${skin.shadow}, 0 20px 25px rgba(0,0,0,0.5)`;
  save();
  renderSkins();
};

// ---------- ПРОФИЛЬ ----------
document.getElementById('saveNick').onclick = () => {
  const newNick = document.getElementById('nickInput').value.trim();
  if (newNick && newNick !== playerName) {
    get(ref(db, 'clickerpro/' + newNick)).then(snap => {
      if (snap.exists()) { alert('Ник занят!'); return; }
      const oldData = { ...state };
      set(ref(db, 'clickerpro/' + newNick), oldData);
      remove(ref(db, 'clickerpro/' + playerName));
      playerName = newNick;
      localStorage.setItem('clickerProNick', playerName);
      location.reload();
    });
  }
};

document.getElementById('resetBtn').onclick = () => {
  if (confirm('Точно сбросить весь прогресс?')) {
    set(userRef, {
      coins: 0,
      totalClicks: 0,
      perClick: 1,
      activeSkins: ['default'],
      currentSkin: 'default',
      boostUntil: 0,
      autoClickUntil: 0,
      lastLogin: new Date().toLocaleString()
    });
  }
};

// Удаление неактивных игроков (не заходивших >30 дней)
document.getElementById('deleteInactiveBtn').onclick = async () => {
  if (!confirm('Удалить всех игроков, которые не заходили больше 30 дней?')) return;
  const snapshot = await get(ref(db, 'clickerpro'));
  const users = snapshot.val() || {};
  const now = Date.now();
  const thirtyDays = 30 * 24 * 60 * 60 * 1000;
  for (const [name, data] of Object.entries(users)) {
    // lastLogin теперь строка, нужно парсить
    const loginTime = data.lastLogin ? new Date(data.lastLogin).getTime() : 0;
    if (loginTime && (now - loginTime) > thirtyDays) {
      await remove(ref(db, 'clickerpro/' + name));
    }
  }
  alert('Старые записи удалены!');
};

// ---------- РЕНДЕР ----------
function renderUI() {
  coinDisplay.textContent = state.coins.toLocaleString() + ' 💰';
  totalClicksEl.textContent = state.totalClicks.toLocaleString();
  perClickEl.textContent = state.perClick + ' за клик';
  
  if (state.lastLogin) {
    lastLoginEl.textContent = state.lastLogin;
  }
  
  let boostText = '';
  if (Date.now() < state.boostUntil) boostText += '⚡ x2 активен | ';
  if (Date.now() < state.autoClickUntil) boostText += '🤖 Автоклик активен';
  boostsDiv.innerHTML = boostText || '';
  
  renderSkins();
}

// НАВИГАЦИЯ
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(btn.dataset.screen).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

renderUI();
</script>
</body>
</html>
