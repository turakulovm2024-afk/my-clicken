<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms Wiki</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #2a2a1a 0%, #0a0a05 100%);
            font-family: 'Courier New', Courier, monospace;
        }
        .btn {
            padding: 25px 50px;
            font-size: 22px;
            font-weight: bold;
            color: #111;
            background: #f1c40f;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            transition: 0.2s;
        }
        .btn:hover {
            background: #ffdb4d;
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.8);
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <a href="https://www.backroomswiki.ru/main" target="_blank" class="btn">
        Войти в Backrooms
    </a>

</body>
</html>
